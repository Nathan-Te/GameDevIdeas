# `docker compose up --build` doit suffire : build du front, migrations au
# démarrage, application disponible sur http://localhost:3000.

services:
  vitrine:
    build: .
    image: vitrine:latest
    container_name: vitrine
    restart: unless-stopped
    ports:
      - "3000:3000"
      # Le point d'entrée public, publié **sur la boucle locale uniquement** :
      # c'est Tailscale Funnel, qui tourne sur l'hôte, qui vient s'y brancher.
      # Le publier sur toutes les interfaces exposerait l'instance au réseau
      # local sans passer par Funnel — et sans que rien ne le dise.
      # Décommenter en même temps que PUBLIC_PORT ci-dessous.
      # - "127.0.0.1:3003:3003"
    volumes:
      # La base et les fichiers utilisateur survivent à toute reconstruction.
      - ./data/db:/app/data/db
      - ./data/files:/app/data/files
      # Les archives aussi : une sauvegarde qui vit dans le conteneur disparaît
      # à la première reconstruction, c'est-à-dire au pire moment.
      - ./data/backups:/app/data/backups
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DB_DIR: /app/data/db
      DATA_FILES_DIR: /app/data/files
      DATA_BACKUPS_DIR: /app/data/backups
      SERVE_STATIC: "true"
      LOG_LEVEL: info
      # Exposition publique (lot 7) — voir Docs/exposition-publique.md.
      # En conteneur, le point d'entrée doit écouter sur toutes les interfaces
      # du conteneur ; c'est la publication ci-dessus qui le restreint à la
      # boucle locale de l'hôte.
      # PUBLIC_PORT: "3003"
      # PUBLIC_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ideas').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
